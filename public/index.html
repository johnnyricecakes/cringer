<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cringer</title><!-- randomized by JS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0c0c0c;
      color: #e2e2e2;
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1a1a1a;
    }

    header h1 {
      font-size: 0.88rem;
      font-weight: 600;
      color: #bbb;
      letter-spacing: -0.01em;
    }
    header h1 span { color: #e63946; }
    header h1 a { color: inherit; text-decoration: none; }
    header h1 a:hover span { text-decoration: underline; }

    .cal-source-label {
      font-size: 0.72rem;
      color: #484848;
      margin-left: auto;
    }
    .cal-source-label a { color: inherit; text-decoration: none; }
    .cal-source-label a:hover { color: #555; }

    /* ── Search ── */
    .search-wrapper { position: relative; display: flex; align-items: center; }
    .search-input {
      background: transparent;
      color: #aaa;
      border: 1px solid #1e1e1e;
      border-radius: 5px;
      padding: 0.38rem 1.6rem 0.38rem 0.65rem;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
      width: 200px;
      transition: border-color 0.1s, color 0.1s;
    }
    .search-input::placeholder { color: #484848; }
    .search-input:focus { border-color: #3a3a3a; color: #e2e2e2; }
    .search-clear {
      position: absolute;
      right: 0.45rem;
      background: none;
      border: none;
      color: #484848;
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
      display: none;
      transition: color 0.1s;
    }
    .search-clear:hover { color: #aaa; }
    .search-clear.visible { display: block; }

    /* Dim filters when search is active */
    .control-group.dimmed {
      opacity: 0.3;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    .control-group { transition: opacity 0.15s; }

    /* ── Controls ── */
    .controls {
      padding: 0.85rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: flex-end;
      border-bottom: 1px solid #1a1a1a;
      position: relative;
      z-index: 10;
    }

    .control-group { display: flex; flex-direction: column; gap: 0.35rem; }

    .control-group > label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #484848;
      font-weight: 500;
    }

    /* Trigger buttons */
    .trigger-btn {
      background: transparent;
      color: #aaa;
      border: 1px solid #1e1e1e;
      border-radius: 5px;
      padding: 0.38rem 0.65rem;
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      white-space: nowrap;
      transition: border-color 0.1s, color 0.1s;
      outline: none;
    }
    .trigger-btn:hover, .trigger-btn.open { border-color: #3a3a3a; color: #e2e2e2; }
    .trigger-arrow { font-size: 0.5rem; opacity: 0.35; transition: transform 0.15s; }
    .trigger-btn.open .trigger-arrow { transform: rotate(180deg); }

    /* ── Multi-select ── */
    .ms-wrapper { position: relative; }
    .ms-trigger { min-width: 200px; }
    .ms-count {
      background: #e63946;
      color: #fff;
      border-radius: 8px;
      font-size: 0.62rem;
      font-weight: 600;
      padding: 1px 5px;
      min-width: 16px;
      text-align: center;
    }

    .ms-panel {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 255px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 7px;
      z-index: 200;
      box-shadow: 0 8px 32px rgba(0,0,0,0.75);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .ms-panel.open { display: flex; }

    .ms-search {
      background: transparent;
      color: #e2e2e2;
      border: none;
      border-bottom: 1px solid #1a1a1a;
      padding: 0.5rem 0.75rem;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
    }
    .ms-search::placeholder { color: #484848; }

    .ms-actions {
      display: flex;
      gap: 0.35rem;
      padding: 0.3rem 0.6rem;
      border-bottom: 1px solid #161616;
    }
    .ms-act {
      background: transparent;
      border: 1px solid #1e1e1e;
      color: #484848;
      border-radius: 3px;
      padding: 2px 8px;
      font-size: 0.68rem;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.1s, border-color 0.1s;
    }
    .ms-act:hover { color: #bbb; border-color: #3a3a3a; }

    .ms-list {
      max-height: 240px;
      overflow-y: auto;
      padding: 0.2rem 0;
      scrollbar-width: thin;
      scrollbar-color: #1e1e1e transparent;
    }
    .ms-list::-webkit-scrollbar { width: 3px; }
    .ms-list::-webkit-scrollbar-thumb { background: #1e1e1e; }

    .ms-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.28rem 0.75rem;
      cursor: pointer;
      font-size: 0.78rem;
      color: #666;
      transition: background 0.06s, color 0.06s;
    }
    .ms-item:hover { background: #161616; color: #e2e2e2; }
    .ms-item.checked { color: #c8c8c8; }
    .ms-item input[type="checkbox"] { accent-color: #e63946; cursor: pointer; flex-shrink: 0; }
    .ms-item.ms-hidden { display: none; }

    /* ── Date range picker ── */
    .dr-wrapper { position: relative; }
    .dr-trigger { min-width: 175px; }
    .dr-trigger-text { flex: 1; }

    .dr-panel {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 7px;
      z-index: 200;
      box-shadow: 0 8px 32px rgba(0,0,0,0.75);
      display: none;
      padding: 0.85rem;
      user-select: none;
    }
    .dr-panel.open { display: block; }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.65rem;
    }
    .cal-nav-btn {
      background: transparent;
      border: 1px solid #1e1e1e;
      color: #555;
      border-radius: 4px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.68rem;
      transition: border-color 0.1s, color 0.1s;
    }
    .cal-nav-btn:hover:not(:disabled) { border-color: #3a3a3a; color: #ccc; }
    .cal-nav-btn:disabled { opacity: 0.2; cursor: default; }
    .cal-month-label { font-size: 0.8rem; font-weight: 500; color: #bbb; }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 32px);
      margin-bottom: 3px;
    }
    .cal-wd {
      text-align: center;
      font-size: 0.6rem;
      color: #484848;
      font-weight: 600;
      padding-bottom: 4px;
      letter-spacing: 0.06em;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 32px);
      gap: 2px;
    }

    .cal-day {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.76rem;
      border-radius: 4px;
      cursor: pointer;
      color: #777;
      transition: background 0.06s, color 0.06s;
    }
    .cal-day.empty { cursor: default; }
    .cal-day.disabled { color: #484848; cursor: default; pointer-events: none; }
    .cal-day.today { color: #e63946; font-weight: 600; }
    .cal-day:hover:not(.disabled):not(.empty) { background: #1a1a1a; color: #fff; }

    .cal-day.in-range { background: rgba(230,57,70,0.1); border-radius: 0; color: #bbb; }
    .cal-day.range-start,
    .cal-day.range-end { background: #e63946; color: #fff; font-weight: 600; }
    .cal-day.range-start { border-radius: 4px 0 0 4px; }
    .cal-day.range-end   { border-radius: 0 4px 4px 0; }
    .cal-day.range-start.range-end { border-radius: 4px; }
    .cal-day.preview-range  { background: rgba(230,57,70,0.07); border-radius: 0; color: #999; }
    .cal-day.preview-start  { background: rgba(230,57,70,0.38); color: #fff; border-radius: 4px 0 0 4px; }
    .cal-day.preview-end    { background: rgba(230,57,70,0.38); color: #fff; border-radius: 0 4px 4px 0; }

    .dr-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.55rem;
      padding-top: 0.5rem;
      border-top: 1px solid #1a1a1a;
    }
    .dr-hint { font-size: 0.68rem; color: #484848; font-style: italic; }
    .dr-clear {
      background: transparent;
      border: none;
      color: #484848;
      font-size: 0.7rem;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.1s;
    }
    .dr-clear:hover { color: #e63946; }

    /* Reset button */
    .btn-reset {
      background: transparent;
      border: 1px solid #1a1a1a;
      color: #484848;
      border-radius: 5px;
      padding: 0.38rem 0.75rem;
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      align-self: flex-end;
      transition: border-color 0.1s, color 0.1s;
    }
    .btn-reset:hover { border-color: #3a3a3a; color: #aaa; }

    /* ── Results bar ── */
    .results-bar {
      padding: 0.45rem 2rem;
      font-size: 0.7rem;
      color: #484848;
      border-bottom: 1px solid #141414;
    }
    .results-bar strong { color: #484848; }

    /* ── Event list ── */
    main { padding: 2rem; max-width: 880px; }

    .venue-section { margin-bottom: 2.5rem; }

    .venue-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }
    .venue-name { font-size: 0.82rem; font-weight: 600; color: #bbb; }
    .venue-name a { color: inherit; text-decoration: none; }
    .venue-name a:hover { color: #e63946; }
    .venue-phone { font-size: 0.68rem; color: #484848; }

    .events-list { border-top: 1px solid #1a1a1a; }

    .event-row {
      display: grid;
      grid-template-columns: 115px 1fr auto;
      gap: 1rem;
      align-items: baseline;
      padding: 0.45rem 0;
      border-bottom: 1px solid #131313;
      transition: background 0.06s;
    }
    .event-row:hover { background: rgba(255,255,255,0.018); }
    .event-row.recurring { }

    .event-date {
      font-size: 0.7rem;
      font-weight: 500;
      color: #484848;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .event-date.recurring-label { color: #484848; font-style: italic; font-weight: 400; }
    .event-row.recurring .event-name { color: #484848; }

    .event-name { font-size: 0.82rem; color: #b8b8b8; line-height: 1.4; }

    .event-meta { font-size: 0.7rem; color: #484848; white-space: nowrap; text-align: right; }

    .badge-soldout {
      display: inline-block;
      color: #e63946;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      vertical-align: middle;
      opacity: 0.75;
    }

    .empty-state { text-align: center; padding: 4rem 2rem; color: #484848; font-size: 0.82rem; }
    .loading     { text-align: center; padding: 4rem 2rem; color: #484848; font-size: 0.82rem; }
    .error-msg {
      background: #0e0505;
      border: 1px solid #250f0f;
      color: #8a4a4a;
      padding: 1rem 1.5rem;
      border-radius: 6px;
      margin: 1.5rem;
      font-size: 0.8rem;
    }

    /* ── Light mode ── */
    body.light-mode {
      background: #f7f7f7;
      filter: invert(1);
    }
    body.light-mode header h1 span,
    body.light-mode .ms-count,
    body.light-mode .cal-day.today,
    body.light-mode .cal-day.range-start,
    body.light-mode .cal-day.range-end,
    body.light-mode .cal-day.in-range,
    body.light-mode .cal-day.preview-range,
    body.light-mode .cal-day.preview-start,
    body.light-mode .cal-day.preview-end,
    body.light-mode .badge-soldout {
      filter: invert(1);
    }

    .btn-light-toggle {
      background: transparent;
      border: 1px solid #1a1a1a;
      color: #484848;
      border-radius: 5px;
      padding: 0.36rem 0.6rem;
      font-size: 0.82rem;
      line-height: 1;
      cursor: pointer;
      align-self: flex-end;
      transition: border-color 0.1s, color 0.1s;
    }
    .btn-light-toggle:hover { border-color: #3a3a3a; color: #aaa; }

    @media (max-width: 640px) {
      header, .controls, main { padding-left: 1.25rem; padding-right: 1.25rem; }
      .controls {
        display: grid;
        grid-template-columns: 5fr 5fr 2fr 1fr;
      }
      .control-group#searchControlGroup {
        grid-column: 1 / -1;
        order: 4;
      }
      .search-input {
        width: 100%;
      }
      .ms-trigger, .dr-trigger { min-width: unset; width: 100%; }
      .ms-panel, .dr-panel { width: 100%; }
      .event-row { grid-template-columns: 88px 1fr; }
      .event-meta { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1 id="siteTitle"></h1>
  <div class="cal-source-label" id="calSourceLabel"></div>
</header>

<div class="controls">

  <!-- Multi-select venue filter -->
  <div class="control-group" id="venueControlGroup">
    <label>Venues</label>
    <div class="ms-wrapper" id="msWrapper">
      <button class="trigger-btn ms-trigger" id="msTrigger" aria-haspopup="listbox" aria-expanded="false">
        <span id="msTriggerText">All venues</span>
        <span class="trigger-arrow">▼</span>
      </button>
      <div class="ms-panel" id="msPanel" role="listbox" aria-multiselectable="true">
        <input type="text" class="ms-search" id="msSearch" placeholder="Search venues…" autocomplete="off">
        <div class="ms-actions">
          <button class="ms-act" id="msSelectAll">Select all</button>
          <button class="ms-act" id="msClearAll">Clear</button>
        </div>
        <div class="ms-list" id="msList"></div>
      </div>
    </div>
  </div>

  <!-- Date range calendar picker -->
  <div class="control-group" id="dateControlGroup">
    <label>Date Range</label>
    <div class="dr-wrapper" id="drWrapper">
      <button class="trigger-btn dr-trigger" id="drTrigger">
        <span class="dr-trigger-text" id="drTriggerText">All dates</span>
        <span class="trigger-arrow">▼</span>
      </button>
      <div class="dr-panel" id="drPanel">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="calPrev" title="Previous month">&#8249;</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button class="cal-nav-btn" id="calNext" title="Next month">&#8250;</button>
        </div>
        <div class="cal-weekdays">
          <div class="cal-wd">SU</div><div class="cal-wd">MO</div><div class="cal-wd">TU</div>
          <div class="cal-wd">WE</div><div class="cal-wd">TH</div><div class="cal-wd">FR</div>
          <div class="cal-wd">SA</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="dr-footer">
          <span class="dr-hint" id="drHint">Click to set start date</span>
          <button class="dr-clear" id="drClear">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Artist search -->
  <div class="control-group" id="searchControlGroup">
    <label>Search</label>
    <div class="search-wrapper">
      <input type="text" class="search-input" id="artistSearch" placeholder="Artist or event…" autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
    </div>
  </div>

  <button class="btn-reset" id="resetBtn">Reset</button>
  <button class="btn-light-toggle" id="lightToggle" title="Toggle light/dark mode">☀</button>

</div>

<div class="results-bar" id="resultsBar">&nbsp;</div>

<main id="main">
  <div class="loading">Loading events…</div>
</main>

<script>
// ─────────────────────────────────────────────
//  Random title
// ─────────────────────────────────────────────
const TITLES = [
  `I Can Haz <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a>`,
  `All Your <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a> Are Belong To Us`,
  `Absolutely Nobody: <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a>`,
  `Epic <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a>`,
  `<a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a>maxxing`,
  `That Feeling When <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a>`,
  `Feels <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a> Man`,
  `Netflix And <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a>`,
  `Much <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a> Such Wow`,
  `New <a href="https://cringe.com" target="_blank" rel="noopener"><span>Cringe</span></a> Unlocked`,
];
(function randomizeTitle() {
  const pick = TITLES[Math.floor(Math.random() * TITLES.length)];
  document.getElementById('siteTitle').innerHTML = pick;
  //document.title = pick.replace(/<[^>]+>/g, '');
})();

// ─────────────────────────────────────────────
//  Cookie helpers
// ─────────────────────────────────────────────
const COOKIE_KEY = 'cringe_venues';
const COOKIE_DAYS = 90;

function saveVenueCookie() {
  const val = JSON.stringify([...selectedVenues]);
  const exp = new Date(Date.now() + COOKIE_DAYS * 864e5).toUTCString();
  document.cookie = `${COOKIE_KEY}=${encodeURIComponent(val)}; expires=${exp}; path=/; SameSite=Lax`;
}

function loadVenueCookie() {
  const match = document.cookie.split('; ').find(c => c.startsWith(COOKIE_KEY + '='));
  if (!match) return [];
  try { return JSON.parse(decodeURIComponent(match.split('=').slice(1).join('='))); }
  catch { return []; }
}

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let allEvents = [];
let allVenues = [];
let apiDateRange = null;

let selectedVenues = new Set(); // empty = all
let searchQuery = '';
let dateStart = null;  // 'YYYY-MM-DD' or null
let dateEnd   = null;
let calSelecting = false;
let calHover  = null;
let calYear   = null;
let calMonth  = null;
let minDate   = null;
let maxDate   = null;

// ─────────────────────────────────────────────
//  Utility
// ─────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isoDate(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function fmtShort(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function formatEventDate(e) {
  if (e.isRecurring) return `Every ${e.dayOfWeek}`;
  if (!e.date) return e.dayOfWeek;
  const [y,m,d] = e.date.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}

// ─────────────────────────────────────────────
//  Multi-select venue
// ─────────────────────────────────────────────
const msWrapper   = document.getElementById('msWrapper');
const msTrigger   = document.getElementById('msTrigger');
const msTriggerTx = document.getElementById('msTriggerText');
const msPanel     = document.getElementById('msPanel');
const msSearch    = document.getElementById('msSearch');
const msList      = document.getElementById('msList');

function buildVenueList(venues) {
  msList.innerHTML = '';
  venues.forEach(v => {
    const item = document.createElement('label');
    item.className = 'ms-item';
    item.dataset.venue = v;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = v;
    cb.addEventListener('change', () => {
      if (cb.checked) selectedVenues.add(v);
      else selectedVenues.delete(v);
      item.classList.toggle('checked', cb.checked);
      updateMsTrigger();
      saveVenueCookie();
      render();
    });
    item.appendChild(cb);
    item.appendChild(document.createTextNode(v));
    msList.appendChild(item);
  });
}

function updateMsTrigger() {
  const n = selectedVenues.size;
  if (n === 0) {
    msTriggerTx.textContent = 'All venues';
    msTrigger.querySelector('.ms-count')?.remove();
  } else {
    msTriggerTx.textContent = n === 1 ? [...selectedVenues][0] : `${n} venues`;
    let badge = msTrigger.querySelector('.ms-count');
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'ms-count';
      msTrigger.insertBefore(badge, msTrigger.querySelector('.trigger-arrow'));
    }
    badge.textContent = n;
  }
}

msTrigger.addEventListener('click', e => {
  e.stopPropagation();
  const open = msPanel.classList.toggle('open');
  msTrigger.classList.toggle('open', open);
  msTrigger.setAttribute('aria-expanded', open);
  if (open) { msSearch.focus(); closeDrPanel(); }
});

msSearch.addEventListener('input', () => {
  const q = msSearch.value.toLowerCase();
  msList.querySelectorAll('.ms-item').forEach(item => {
    item.classList.toggle('ms-hidden', q && !item.dataset.venue.toLowerCase().includes(q));
  });
});

document.getElementById('msSelectAll').addEventListener('click', () => {
  msList.querySelectorAll('.ms-item:not(.ms-hidden) input').forEach(cb => {
    cb.checked = true;
    selectedVenues.add(cb.value);
    cb.closest('.ms-item').classList.add('checked');
  });
  updateMsTrigger();
  saveVenueCookie();
  render();
});

document.getElementById('msClearAll').addEventListener('click', () => {
  msList.querySelectorAll('.ms-item input').forEach(cb => {
    cb.checked = false;
    cb.closest('.ms-item').classList.remove('checked');
  });
  selectedVenues.clear();
  updateMsTrigger();
  saveVenueCookie();
  render();
});

function closeMsPanel() {
  msPanel.classList.remove('open');
  msTrigger.classList.remove('open');
  msTrigger.setAttribute('aria-expanded', false);
}

// ─────────────────────────────────────────────
//  Calendar date range picker
// ─────────────────────────────────────────────
const drWrapper   = document.getElementById('drWrapper');
const drTrigger   = document.getElementById('drTrigger');
const drTriggerTx = document.getElementById('drTriggerText');
const drPanel     = document.getElementById('drPanel');
const calGrid     = document.getElementById('calGrid');
const calMonthLbl = document.getElementById('calMonthLabel');
const drHint      = document.getElementById('drHint');

const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function updateDrTrigger() {
  if (!dateStart && !dateEnd) {
    drTriggerTx.textContent = 'All dates';
  } else if (dateStart && !dateEnd) {
    drTriggerTx.textContent = fmtShort(dateStart) + ' →';
  } else {
    const s = fmtShort(dateStart), e = fmtShort(dateEnd);
    drTriggerTx.textContent = s === e ? s : `${s} – ${e}`;
  }
}

function buildCalendar() {
  calMonthLbl.textContent = `${MONTHS[calMonth]} ${calYear}`;

  const firstOfMonth = isoDate(calYear, calMonth, 1);
  const lastOfMonth  = isoDate(calYear, calMonth, daysInMonth(calYear, calMonth));
  document.getElementById('calPrev').disabled = minDate && firstOfMonth <= minDate.slice(0,7) + '-01';
  document.getElementById('calNext').disabled = maxDate && lastOfMonth >= maxDate;

  calGrid.innerHTML = '';
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const days     = daysInMonth(calYear, calMonth);
  const today    = todayISO();

  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day empty';
    calGrid.appendChild(cell);
  }

  for (let d = 1; d <= days; d++) {
    const iso = isoDate(calYear, calMonth, d);
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    cell.textContent = d;
    cell.dataset.date = iso;

    if ((minDate && iso < minDate) || (maxDate && iso > maxDate)) {
      cell.classList.add('disabled');
    } else {
      if (iso === today) cell.classList.add('today');
      cell.addEventListener('mouseenter', () => {
        if (calSelecting && dateStart) { calHover = iso; applyRangeClasses(); }
      });
      cell.addEventListener('click', () => handleDayClick(iso));
    }

    calGrid.appendChild(cell);
  }

  applyRangeClasses();
}

function applyRangeClasses() {
  let hiStart = dateStart, hiEnd = dateEnd;
  if (calSelecting && calHover && dateStart) {
    if (calHover >= dateStart) { hiStart = dateStart; hiEnd = calHover; }
    else                       { hiStart = calHover;  hiEnd = dateStart; }
  }

  calGrid.querySelectorAll('.cal-day[data-date]').forEach(cell => {
    cell.classList.remove(
      'range-start','range-end','in-range',
      'preview-start','preview-end','preview-range'
    );
    const iso = cell.dataset.date;
    if (hiStart && hiEnd) {
      if      (iso === hiStart && iso === hiEnd) cell.classList.add('range-start','range-end');
      else if (iso === hiStart) cell.classList.add(calSelecting ? 'preview-start' : 'range-start');
      else if (iso === hiEnd)   cell.classList.add(calSelecting ? 'preview-end'   : 'range-end');
      else if (iso > hiStart && iso < hiEnd)
        cell.classList.add(calSelecting ? 'preview-range' : 'in-range');
    } else if (hiStart && iso === hiStart) {
      cell.classList.add('range-start','range-end');
    }
  });

  if (calSelecting && dateStart) {
    drHint.textContent = `${fmtShort(dateStart)} selected — click end date`;
  } else if (dateStart && dateEnd) {
    drHint.textContent = `${fmtShort(dateStart)} – ${fmtShort(dateEnd)}`;
  } else {
    drHint.textContent = 'Click to set start date';
  }
}

function handleDayClick(iso) {
  if (!calSelecting) {
    dateStart = iso;
    dateEnd   = null;
    calSelecting = true;
    calHover = null;
  } else {
    if (iso >= dateStart) {
      dateEnd = iso;
    } else {
      dateEnd   = dateStart;
      dateStart = iso;
    }
    calSelecting = false;
    calHover = null;
  }
  updateDrTrigger();
  buildCalendar();
  render();
}

function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

function todayISO() {
  const t = new Date();
  return isoDate(t.getFullYear(), t.getMonth(), t.getDate());
}

drTrigger.addEventListener('click', e => {
  e.stopPropagation();
  const open = drPanel.classList.toggle('open');
  drTrigger.classList.toggle('open', open);
  if (open) { buildCalendar(); closeMsPanel(); }
});

document.getElementById('calPrev').addEventListener('click', () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  buildCalendar();
});

document.getElementById('calNext').addEventListener('click', () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  buildCalendar();
});

document.getElementById('drClear').addEventListener('click', () => {
  dateStart = null; dateEnd = null; calSelecting = false; calHover = null;
  updateDrTrigger();
  buildCalendar();
  render();
});

drPanel.addEventListener('mouseleave', () => {
  if (calSelecting) { calHover = null; applyRangeClasses(); }
});

function closeDrPanel() {
  drPanel.classList.remove('open');
  drTrigger.classList.remove('open');
  if (calSelecting && !dateEnd) {
    dateStart = null; calSelecting = false; calHover = null;
    updateDrTrigger(); render();
  }
}

msPanel.addEventListener('click', e => e.stopPropagation());
drPanel.addEventListener('click', e => e.stopPropagation());

document.addEventListener('click', e => {
  if (!msWrapper.contains(e.target)) closeMsPanel();
  if (!drWrapper.contains(e.target)) closeDrPanel();
});

// ─────────────────────────────────────────────
//  Controls
// ─────────────────────────────────────────────
const resetBtn          = document.getElementById('resetBtn');
const artistSearch      = document.getElementById('artistSearch');
const searchClear       = document.getElementById('searchClear');
const venueControlGroup = document.getElementById('venueControlGroup');
const dateControlGroup  = document.getElementById('dateControlGroup');
const mainEl            = document.getElementById('main');
const resultsBar        = document.getElementById('resultsBar');

function updateSearchState() {
  const active = searchQuery.length > 0;
  searchClear.classList.toggle('visible', active);
  venueControlGroup.classList.toggle('dimmed', active);
  dateControlGroup.classList.toggle('dimmed', active);
}

artistSearch.addEventListener('input', () => {
  searchQuery = artistSearch.value.trim();
  updateSearchState();
  render();
});

searchClear.addEventListener('click', () => {
  searchQuery = '';
  artistSearch.value = '';
  updateSearchState();
  render();
});

resetBtn.addEventListener('click', () => {
  selectedVenues.clear();
  msList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.checked = false;
    cb.closest('.ms-item').classList.remove('checked');
  });
  updateMsTrigger();
  saveVenueCookie();

  searchQuery = '';
  artistSearch.value = '';
  updateSearchState();

  setDefaultWeek();
  updateDrTrigger();
  buildCalendar();

  render();
});

// ─────────────────────────────────────────────
//  Filtering & rendering
// ─────────────────────────────────────────────
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// Returns the set of day names (e.g. "Wed") covered by the current date range,
// or null if no range or the range spans a full week (all days covered).
function recurringDayFilter() {
  if (!dateStart || !dateEnd) return null;
  const start = new Date(dateStart + 'T00:00:00');
  const end   = new Date(dateEnd   + 'T00:00:00');
  const diffDays = Math.round((end - start) / 86400000);
  if (diffDays >= 6) return null;
  const days = new Set();
  for (let i = 0; i <= diffDays; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    days.add(DAY_NAMES[d.getDay()]);
  }
  return days;
}

function filterEvents(events) {
  // Always strip past events (recurring events have no specific date, so always keep them)
  const today = todayISO();
  events = events.filter(e => e.isRecurring || !e.date || e.date >= today);

  const q = searchQuery.toLowerCase();
  // Search ignores venue and date filters — show all matching events across all dates/venues
  if (q) return events.filter(e => e.eventText.toLowerCase().includes(q));

  const dayFilter = recurringDayFilter();
  return events.filter(e => {
    if (selectedVenues.size > 0 && !selectedVenues.has(e.venue)) return false;
    if (e.isRecurring) {
      // Only show recurring events whose day of week falls within the date range
      return dayFilter === null || dayFilter.has(e.dayOfWeek);
    }
    if (dateStart && e.date < dateStart) return false;
    if (dateEnd   && e.date > dateEnd)   return false;
    return true;
  });
}

function render() {
  const filtered = filterEvents(allEvents);

  const byVenue = {};
  filtered.forEach(e => {
    if (!byVenue[e.venue]) byVenue[e.venue] = { events:[], venueUrl:e.venueUrl, phone:e.phone };
    byVenue[e.venue].events.push(e);
  });

  const venueNames = Object.keys(byVenue).sort((a, b) => a.localeCompare(b));
  const total = filtered.length;

  resultsBar.innerHTML = `<strong>${total}</strong> event${total !== 1 ? 's' : ''} at <strong>${venueNames.length}</strong> venue${venueNames.length !== 1 ? 's' : ''}`;

  if (venueNames.length === 0) {
    mainEl.innerHTML = `<div class="empty-state">No events match your filters.</div>`;
    return;
  }

  mainEl.innerHTML = venueNames.map(vName => {
    const { events, venueUrl, phone } = byVenue[vName];
    events.sort((a, b) => {
      if (a.isRecurring && !b.isRecurring) return 1;
      if (!a.isRecurring && b.isRecurring) return -1;
      return (a.date || '').localeCompare(b.date || '');
    });

    const nameHtml = venueUrl
      ? `<a href="${esc(venueUrl)}" target="_blank" rel="noopener">${esc(vName)}</a>`
      : esc(vName);

    const eventsHtml = events.map(e => {
      const dl = formatEventDate(e);
      const meta = [e.time, e.price].filter(Boolean).join(' · ');
      return `<div class="event-row${e.isRecurring ? ' recurring' : ''}">
        <div class="event-date ${e.isRecurring ? 'recurring-label' : ''}">${esc(dl)}</div>
        <div class="event-name">${esc(e.eventText)}${e.soldOut ? ' <span class="badge-soldout">SOLD OUT</span>' : ''}</div>
        <div class="event-meta">${esc(meta)}</div>
      </div>`;
    }).join('');

    return `<div class="venue-section">
      <div class="venue-header">
        <div class="venue-name">${nameHtml}</div>
      </div>
      <div class="events-list">${eventsHtml}</div>
    </div>`;
  }).join('');
}

// ─────────────────────────────────────────────
//  Default "upcoming week" selection
// ─────────────────────────────────────────────
function setDefaultWeek() {
  dateStart = null;
  dateEnd   = null;
  calSelecting = false;
}

// ─────────────────────────────────────────────
//  Bootstrap
// ─────────────────────────────────────────────
async function loadEvents() {
  try {
    const res = await fetch('/api/events');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allEvents    = data.events;
    allVenues    = data.venues;
    apiDateRange = data.dateRange;

    if (data.fetchedAt) {
      const d = new Date(data.fetchedAt);
      const label = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      document.getElementById('calSourceLabel').innerHTML = `fetched from <a href="https://cringe.com" target="_blank" rel="noopener">cringe.com</a> on ${label}`;
    }

    if (apiDateRange && apiDateRange.year != null) {
      const p = n => String(n).padStart(2,'0');
      const y = apiDateRange.year;
      minDate  = `${y}-${p(apiDateRange.startMonth+1)}-${p(apiDateRange.startDay)}`;
      maxDate  = `${y}-${p(apiDateRange.endMonth+1)}-${p(apiDateRange.endDay)}`;
      calYear  = y;
      calMonth = apiDateRange.startMonth;
    } else {
      const t = new Date();
      calYear = t.getFullYear(); calMonth = t.getMonth();
    }

    buildVenueList(allVenues);

    const saved = loadVenueCookie().filter(v => allVenues.includes(v));
    if (saved.length > 0) {
      saved.forEach(v => {
        selectedVenues.add(v);
        const item = msList.querySelector(`.ms-item[data-venue="${CSS.escape(v)}"]`);
        if (item) { item.querySelector('input').checked = true; item.classList.add('checked'); }
      });
      updateMsTrigger();
    }

    setDefaultWeek();
    updateDrTrigger();
    render();
  } catch (e) {
    mainEl.innerHTML = `<div class="error-msg">Could not load events. Is the server running?<br><small>${e.message}</small></div>`;
  }
}

document.getElementById('lightToggle').addEventListener('click', () => {
  document.body.classList.toggle('light-mode');
});

loadEvents();
</script>
